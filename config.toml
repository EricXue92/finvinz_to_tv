[settings]
output_dir = "output"
delay_between_requests = 8.0
output_format = "comma"    # "comma" = AAPL,MSFT  |  "newline" = 一行一个
min_dollar_volume = 100_000_000  # Longs 过滤: price * avg volume >= 100M
# ADR% (Average Daily Range) 全局门槛 — 应用到 Longs / Leaders / RS / Shorts /
# HK Shorts / Morning Gap。ADR% = mean((High - Low) / Close) over last
# `adr_days` completed daily bars * 100。过滤"无波动"的票，捕捉 catalyst-
# driven volatility。设 0 即可关闭。原 Finviz beta>1.5 过滤已废弃 (beta 反映
# 多年市场相关性，与"现在是不是 in-play"正交)，由 ADR% 替代。
min_adr_percent = 4.0
adr_days = 20
# Two-tier IBD Relative Strength percentile (0-99) gate.
# Source: Fred6725/rs-log/output/rs_stocks.csv (refreshed weekday ~01:30 UTC).
# Leaders use min_rs_percentile (top 10%). Longs (5 splits), the conditional
# RS group, and US Shorts share min_rs_percentile_longs (also top 10%).
# Set either to 0 to disable that tier; the GitHub fetch is skipped only
# when both are 0. Tickers missing from the table (recent IPOs without
# 12 months of history, foreign listings) are kept, not dropped.
min_rs_percentile = 89          # Leaders only — IBD RS percentile gate
min_rs_percentile_longs = 89    # Longs (5 splits) + RS group + US Shorts — IBD RS percentile gate

# --- Futu (富途牛牛) 自动同步 ---
# 需要本地运行 FutuOpenD,且分组需在富途客户端预先手动建好(API 不能新建分组)
[futu]
enabled = true
host = "127.0.0.1"
port = 11111
# Groups in this list are append-only: scanners only ADD tickers, never DEL.
# All EOD groups are append-only so they pair with the cross-day master
# 'seen' file (state/eod_seen_{US,HK}.txt) — each ticker enters exactly one
# group on its first sighting, and the Futu group accumulates monotonically.
# Clear groups manually in the Futu client when they get too crowded
# (Futu cap: 500 per group for non-traders, 2000 for active traders).
append_only_groups = [
    "EarningsGap",
    "HighVolume",
    "GapUp",
    "NewHigh52W",
    "TopGainers",
    "Leaders",
    "Shorts",
    "RS",
    "HKShorts",
    "IPO",
    # HK long-side groups (added 2026-05-06)
    "HKEarningsGap",
    "HKHighVolume",
    "HKGapUp",
    "HKLeaders",
    "HKRS",
    "HKIPO",
    "HKMorningGap",
]

[futu.groups]
# EarningsGap is the merged "gap watch" group: EOD earnings-gap scan +
# pre-market morning-gap + post-open morning-gap all sync into it (append-only).
longs_earnings_gap = "EarningsGap"
morning_gap = "EarningsGap"
morning_gap_pre = "EarningsGap"
longs_high_volume = "HighVolume"
longs_gap_up = "GapUp"
longs_new_high_52w = "NewHigh52W"
longs_top_gainers = "TopGainers"
shorts = "Shorts"
rs = "RS"
hk_shorts = "HKShorts"
leaders = "Leaders"
# IPO collects long-side candidates dropped by yfinance (insufficient daily
# history). Separate cross-day master (state/eod_seen_IPO.txt), append-only.
ipo = "IPO"
# HK long-side groups (Futu-only EOD pipeline, added 2026-05-06)
hk_longs_earnings_gap = "HKEarningsGap"
hk_longs_high_volume  = "HKHighVolume"
hk_longs_gap_up       = "HKGapUp"
hk_leaders            = "HKLeaders"
hk_rs                 = "HKRS"
# HK IPO sidecar — short-history HK Main Board listings that don't have
# 12 months of yfinance data yet. Independent cross-day master.
hk_ipo                = "HKIPO"
# HK morning-gap (post-open intraday scanner, mirror of US morning_gap).
# HK has no pre-auction data via Futu snapshot, so there is no _pre variant.
hk_morning_gap        = "HKMorningGap"

# --- Longs: 5 个子策略，按 list 顺序内部互斥去重，每个单独输出。
# 优先级 (高 → 低): EarningsGap > HighVolume > GapUp > NewHigh52W > TopGainers
# 并集仍参与 Longs > Leaders > RS 的跨组去重。

[[longs]]
key = "earnings_gap"
name = "Earnings Gap"
filters = ["ind_stocksonly","cap_smallover","earningsdate_today","sh_avgvol_o500","sh_price_o10","sh_relvol_o1.5","ta_gap_u5","ta_sma50_pa","ta_sma200_pa"]

[[longs]]
key = "high_volume"
name = "Relative Volume Surge"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_perf_dup","ta_sma50_pa","ta_sma200_pa"]
min_relative_volume = 3
relative_volume_days = 20

[[longs]]
key = "gap_up"
name = "Gap Up"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_gap_u3","ta_sma50_pa","ta_sma200_pa"]

[[longs]]
key = "new_high_52w"
name = "52W New High"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_highlow52w_nh","ta_sma200_pa","ta_sma50_pa"]

[[longs]]
key = "top_gainers"
name = "Top Gainers"
signal = "ta_topgainers"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_sma50_pa","ta_sma200_pa"]

# --- Leaders: 强势 + 站上均线，5 个 perf 窗口合并去重，输出为 Leaders.txt ---
# 共同条件: cap >= small, avg vol > 500K, price > $10,
#           价格在 SMA50 / SMA200 之上;
# 全局 min_dollar_volume ($100M, 20-day avg) 和 min_adr_percent (>= 4.0%, 20d)
# 也会自动套用。

[[leaders]]
name = "Leaders 4W +30%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_perf_4w30o","ta_sma200_pa","ta_sma50_pa"]

[[leaders]]
name = "Leaders 13W +50%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_perf_13w50o","ta_sma200_pa","ta_sma50_pa"]

[[leaders]]
name = "Leaders 26W +100%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_perf_26w100o","ta_sma200_pa","ta_sma50_pa"]

[[leaders]]
name = "Leaders YTD +100%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_perf_ytd100o","ta_sma200_pa","ta_sma50_pa"]

[[leaders]]
name = "Leaders 52W +150%"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_perf_52w150o","ta_sma200_pa","ta_sma50_pa"]

# --- Shorts: 基于 Kristjan Kullamägi 博客的做空筛选，单独输出为 Shorts.txt ---

[shorts]
name = "Short Candidates"
filters = ["ind_stocksonly", "ta_sma20_pa20", "ta_sma50_pa", "sh_avgvol_o1000", "cap_smallover"]
min_dollar_volume = 100_000_000
min_consecutive_up_days = 3
# Performance thresholds by cap size (month perf %)
perf_large_cap = 50     # >= $10B: month perf >= 50%
perf_mid_cap = 200      # $2B–$10B: month perf >= 200%
perf_small_cap = 300    # $300M–$2B: month perf >= 300%

# --- RS: 条件触发，仅当 SPY 和 QQQ 都跌超 1% 时运行 ---

[rs]
name = "Relative Strength"
filters = ["ind_stocksonly","cap_smallover","sh_avgvol_o500","sh_price_o10","ta_perf_dup","ta_sma200_pa","ta_sma50_pa"]

# --- HK Shorts: 基于 HKEX 数据的港股做空筛选，输出为 output/TV/HK/<date>_Shorts.txt ---
# 重新启用 (2026-05-06): 与新的 HK 长线扫描共享统一阈值。
# Shorts 保留独立的 1M 日均量门槛（与 US Shorts 对称），
# 长线 5 个组共用 [hk_settings].min_avg_volume = 500_000。

[hk_shorts]
name = "HK Short Candidates"
min_avg_volume = 1_000_000             # 日均成交量 (股) — Shorts 独有的 1M 门槛
min_market_cap = 300_000_000           # 最低市值 (HKD, 3亿)
min_dollar_volume = 100_000_000        # 最低成交额 (HKD)
min_consecutive_up_days = 3
# 按市值分级的月涨幅阈值 (%)
perf_large_cap = 50                    # >= 100亿 HKD
perf_mid_cap = 200                     # 20亿-100亿 HKD
perf_small_cap = 300                   # 3亿-20亿 HKD
# 市值分界线 (HKD)
large_cap_threshold = 10_000_000_000
mid_cap_threshold = 2_000_000_000

# --- HK Long-side: EarningsGap / HighVolume / GapUp / Leaders / 条件触发 RS ---
# 数据源: Futu OpenAPI (k-line + snapshot)，与 US 长线扫描方法学对齐，
# 阈值用 HKD 表示。EarningsGap 用形态识别 (gap + RVol) 替代财报日历。

[hk_settings]
min_market_cap          = 300_000_000     # HKD
min_dollar_volume       = 100_000_000     # HKD; 价 × 20 日均量
min_avg_volume          = 500_000         # 5 个长线组的统一日均量门槛
# ADR% 调低至 3.5 (US 用 4.0)。HK 蓝筹波动率结构性低于 US — 5 只样本中
# (00700/00005/01810/01211/09988) 仅 1 只过 ADR>=4，长期会把整个百强股
# 池砍掉。3.5 在"放过百强股"和"还能筛掉静态低波动股"之间取折中。
min_adr_percent         = 3.5
min_price               = 20.0            # HKD
min_rs_percentile_longs = 89              # 与 HSI 比较，本地 IBD 算法
hsi_rs_trigger          = -1.5            # HSI 当日跌幅 ≤ 此值则触发 RS 组

[[hk_longs]]
key = "earnings_gap"
name = "HK Earnings Gap"
min_relative_volume = 3
min_gap_percent = 3.0

[[hk_longs]]
key = "high_volume"
name = "HK Relative Volume Surge"
min_relative_volume = 3

[[hk_longs]]
key = "gap_up"
name = "HK Gap Up"
min_gap_percent = 5.0

[[hk_leaders]]
name = "HK Leaders 4W +30%"
min_perf_4w = 30

[[hk_leaders]]
name = "HK Leaders 13W +50%"
min_perf_13w = 50

[[hk_leaders]]
name = "HK Leaders 26W +100%"
min_perf_26w = 100

[[hk_leaders]]
name = "HK Leaders YTD +100%"
min_perf_ytd = 100

[[hk_leaders]]
name = "HK Leaders 52W +150%"
min_perf_52w = 150

[hk_rs]
name = "HK Relative Strength"

# --- Morning Gap: 盘前 -20/-10 + 盘后 +10/+15/+20/+25/+30 分钟扫描 ---
# 负数 offset = 盘前扫描 (输出到 MorningGapPre.txt, 跳过盘中累计成交量过滤);
# 正数 offset = 盘后扫描 (输出到 MorningGap.txt, 累计量须 >= 20日均量)。
# 两者共享 Finviz 过滤和 20日美元成交量 >= $100M 的门槛。

[morning_gap]
name = "Morning Gap Up"
# Discovery via Futu snapshot over a curated US universe (replaces the
# Finviz `ta_topgainers` signal — empirically that surfaced last week's
# regular-session gainers, not today's pre-market gappers, so earnings
# gaps like TWLO 2026-05-01 +19.5% never entered the candidate set).
# Pre-market scans use `pre_change_rate`; post-open scans use change_rate
# derived from (last_price - prev_close_price) / prev_close_price.
exchanges = ["US_NASDAQ", "US_NYSE", "US_AMEX"]
min_gap_percent = 5.0           # gap threshold for both pre & post discovery
min_market_cap = 300_000_000    # USD; mirrors Finviz cap_smallover
min_price = 10.0                # USD; mirrors Finviz sh_price_o10
min_avg_volume = 500_000        # 20d shares/day; mirrors Finviz sh_avgvol_o500
avg_volume_days = 20
min_dollar_volume = 100_000_000
scan_offsets = [-20, -10, -5, 5, 10, 15, 20, 25, 30]
offset_tolerance_minutes = 2
# ADR% filter is inherited from [settings] (min_adr_percent / adr_days).
# Override here if a different threshold is desired for morning-gap only.

# --- HK Morning Gap (盘后扫描,无盘前) ---
# 港股没有 US 式的盘前数据 (Futu 快照 pre_change_rate / pre_volume 对 HK
# 全部返回 N/A,验证日 2026-05-11),所以只有盘后扫描:09:30 HKT 开盘后
# +5/+10/+15/+20/+25/+30 分钟。gap = (last_price - prev_close_price) / prev_close。
# Universe = HKEX 主板 (~2,400),通过 Futu basicinfo 拉取。
# 基线门槛对齐 HK 长仓 ([hk_settings]): cap≥HK$300M、价≥HK$20、20日均量
# ≥500K 股、20日均成交额≥HK$100M、ADR≥3.5%、收盘价站上 SMA50+SMA200。
# 之后过滤累计量:盘中累计 volume ≥ 20 日均量 (Futu 快照 volume 字段是
# 当日 RTH 累计,非 pre/after)。无 yfinance 1m fallback (HK 1m 数据不稳)。
[hk_morning_gap]
name = "HK Morning Gap Up"
exchanges = ["HK_MAINBOARD"]
min_gap_percent = 5.0           # 同 US
min_market_cap = 300_000_000    # HKD,与 [hk_settings] 长仓基线一致
min_price = 20.0                # HKD,与 [hk_settings] 长仓基线一致
min_avg_volume = 500_000        # 20日股数/天
avg_volume_days = 20
min_dollar_volume = 100_000_000 # HKD,20日均量 × 最新收盘
scan_offsets = [10, 20, 30, 40, 50, 60]
offset_tolerance_minutes = 2
# min_adr_percent / adr_days 默认继承 [hk_settings] (3.5% / 20d);
# 也可在这里覆盖。

# --- 推送通知 (ntfy.sh) ---
# Morning-gap 扫描发现"新"票时推送到 phone + Mac 浏览器。
# 同一交易日内已出现过的票不会重复推送(state 文件: output/state/morning_gap_seen_<date>.txt)。
# Topic 名后缀是随机串 = 私人频道,谁知道 topic 名谁就能订阅。
[notify]
enabled = true
ntfy_topic = "xue-finviz-morning-gap-9f3k2"
ntfy_server = "https://ntfy.sh"
max_tickers_in_body = 50

# --- 报告生成 LLM backend ---
# 选择哪个大模型生成 CANSLIM 日报。两个 backend 走相同的 Anthropic SDK 协议
# (DeepSeek 通过 /anthropic 兼容端点),区别在于 web 搜索来源:
#   anthropic — Anthropic 原生 web_search_20250305 (单次请求,模型自主调用,
#               质量最好,成本 ~$1-2/天 per market @ 30 tickers)
#   deepseek  — DeepSeek V4 Flash + 外部 Tavily 搜索 (tool-call 循环,
#               质量略弱但便宜 ~80%,成本 ~$0.5/天 per market;
#               需要 DEEPSEEK_API_KEY + TAVILY_API_KEY)
[report]
# backend = "anthropic"
backend = "DeepSeek"

[report.anthropic]
model = "claude-sonnet-4-6"   # claude-opus-4-7
max_tokens = 3500
web_search_max_uses = 2

[report.deepseek]
model = "deepseek-v4-pro"
base_url = "https://api.deepseek.com/anthropic"
max_tokens = 3500
max_search_calls = 2
