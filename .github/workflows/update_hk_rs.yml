name: Update HK RS Table

on:
  schedule:
    - cron: '0 11 * * 1-5'      # 11:00 UTC Mon-Fri = 19:00 HKT (3h after 16:00 close, ~1h before local 20:00 run)
  workflow_dispatch:           # manual trigger for debugging + first seed

permissions:
  contents: write              # commit the daily CSV back to main

jobs:
  build-hk-rs-table:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # ~2,400 HK universe; smaller than the US ~5,900

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Verify curl_cffi active
        run: uv run python -c "import curl_cffi; import yfinance; print('curl_cffi', curl_cffi.__version__, '/ yfinance', yfinance.__version__)"

      - name: Compute HK RS table
        run: uv run python scripts/compute_hk_rs_cloud.py

      - name: Prune old CSVs (keep last 4 days)
        run: uv run python scripts/prune_old_data.py data/hk_rs data/hk_metrics --keep 4

      - name: Commit and push
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/hk_rs/ data/hk_metrics/
          if git diff --staged --quiet; then
            echo "Nothing to commit (script failed or produced no new file)"
            exit 0
          fi
          git commit -m "chore(hk_rs): publish $(date -u +%Y-%m-%d) table"
          # Retry with rebase if main moved during our compute window. A
          # concurrent run (the launchd self-trigger + the GH cron kept as
          # belt-and-suspenders) may have already published today's dated CSV,
          # so the rebase is an add/add conflict on that file — NOT the trivial
          # replay this once assumed. Resolve in our favor with -X theirs (in a
          # rebase, "theirs" is the commit being replayed = our freshly-computed
          # table) so the push converges instead of failing the job.
          git push || (git pull --rebase -X theirs origin main && git push)
